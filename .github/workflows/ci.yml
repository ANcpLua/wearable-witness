name: ci
on:
  push:
  pull_request:
jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace
      - name: Clippy (pedantic at warn; only hard errors fail)
        run: cargo clippy --workspace --all-targets
      - name: Cache the PhysioNet bytes (keyed on the corpus index, so a changed hash refetches)
        uses: actions/cache@v4
        with:
          path: corpus/records
          key: physionet-wrist-${{ hashFiles('corpus/index.json') }}
      - name: Fetch and verify the PhysioNet bytes
        run: tools/fetch.sh
      - name: README numbers match a fresh run, controls behave
        run: tools/measure.sh --check
